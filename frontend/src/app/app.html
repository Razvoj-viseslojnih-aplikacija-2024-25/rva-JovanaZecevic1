<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened [fixedInViewport]="true">
    <div class="sidenav-header">
      <h2>🏥 Bolnica</h2>
    </div>
    <mat-accordion>
      <a mat-button routerLink="/home" class="home-btn">
        <mat-icon>home</mat-icon> Početna
      </a>
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>Aplikacija</mat-panel-title>
          <mat-panel-description>Upravljanje podacima</mat-panel-description>
        </mat-expansion-panel-header>
        <mat-nav-list>
          <a mat-button routerLink="/bolnica">🏥 Bolnica</a>
        </mat-nav-list>
        <mat-nav-list>
          <a mat-button routerLink="/odeljenje">🏨 Odeljenje</a>
        </mat-nav-list>
        <mat-nav-list>
          <a mat-button routerLink="/dijagnoza">🩺 Dijagnoza</a>
        </mat-nav-list>
        <mat-nav-list>
          <a mat-button routerLink="/pacijent">👤 Pacijent</a>
        </mat-nav-list>
      </mat-expansion-panel>
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>Informacije</mat-panel-title>
          <mat-panel-description>O aplikaciji</mat-panel-description>
        </mat-expansion-panel-header>
        <mat-nav-list>
          <a mat-button routerLink="/about">O aplikaciji</a>
        </mat-nav-list>
        <mat-nav-list>
          <a mat-button routerLink="/author">Autor</a>
        </mat-nav-list>
      </mat-expansion-panel>
    </mat-accordion>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
