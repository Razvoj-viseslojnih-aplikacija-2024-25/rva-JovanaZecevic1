<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened [fixedInViewport]="true">
    <div class="sidenav-header">
      <div class="logo-circle">B</div>
      <span class="logo-text">Bolnica</span>
    </div>

    <nav class="sidenav-nav">
      <a routerLink="/home" class="nav-item">
        <div class="nav-icon-wrap">
          <mat-icon>home</mat-icon>
        </div>
        <span>Početna</span>
      </a>

      <div class="nav-section-label">Aplikacija</div>

      <mat-expansion-panel class="nav-panel">
        <mat-expansion-panel-header>
          <mat-panel-title>Upravljanje podacima</mat-panel-title>
        </mat-expansion-panel-header>
        <a routerLink="/bolnica" class="nav-sub-item">
          <div class="nav-icon-wrap small"><mat-icon>local_hospital</mat-icon></div>
          Bolnica
        </a>
        <a routerLink="/odeljenje" class="nav-sub-item">
          <div class="nav-icon-wrap small"><mat-icon>meeting_room</mat-icon></div>
          Odeljenje
        </a>
        <a routerLink="/dijagnoza" class="nav-sub-item">
          <div class="nav-icon-wrap small"><mat-icon>healing</mat-icon></div>
          Dijagnoza
        </a>
        <a routerLink="/pacijent" class="nav-sub-item">
          <div class="nav-icon-wrap small"><mat-icon>person</mat-icon></div>
          Pacijent
        </a>
      </mat-expansion-panel>

      <div class="nav-section-label">Informacije</div>

      <mat-expansion-panel class="nav-panel">
        <mat-expansion-panel-header>
          <mat-panel-title>O aplikaciji</mat-panel-title>
        </mat-expansion-panel-header>
        <a routerLink="/about" class="nav-sub-item">
          <div class="nav-icon-wrap small"><mat-icon>info</mat-icon></div>
          O aplikaciji
        </a>
        <a routerLink="/author" class="nav-sub-item">
          <div class="nav-icon-wrap small"><mat-icon>account_circle</mat-icon></div>
          Autor
        </a>
      </mat-expansion-panel>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
