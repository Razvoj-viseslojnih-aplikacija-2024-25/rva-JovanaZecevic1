<div class="page-container">

  <div class="page-header">
    <div class="header-left">
      <div class="header-icon">
        <mat-icon>meeting_room</mat-icon>
      </div>
      <div>
        <h1>Odeljenja</h1>
        <p>Upravljanje odeljenjima unutar bolnica</p>
      </div>
    </div>
    <button class="add-btn" (click)="openDialog(1)">
      <mat-icon>add</mat-icon>
      Dodaj odeljenje
    </button>
  </div>

  <div class="search-bar">
    <mat-form-field appearance="outline" class="search-select">
      <mat-select [(ngModel)]="searchType">
        <mat-option value="naziv">Naziv</mat-option>
        <mat-option value="lokacija">Lokacija</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="search-input">
      <input matInput [(ngModel)]="searchValue" placeholder="Unesite vrednost..."
            (keyup.enter)="search()"/>
    </mat-form-field>

    <button class="add-btn" (click)="search()">Pretraži</button>
    <button class="reset-btn" (click)="searchValue = ''; loadData()">Resetuj</button>
  </div>

  <div class="table-card">
    <table mat-table matSort [dataSource]="dataSource">

      <ng-container matColumnDef="id">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="naziv">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Naziv</th>
        <td mat-cell *matCellDef="let row">{{ row.naziv }}</td>
      </ng-container>

      <ng-container matColumnDef="lokacija">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Lokacija</th>
        <td mat-cell *matCellDef="let row">{{ row.lokacija }}</td>
      </ng-container>

      <ng-container matColumnDef="bolnica">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Bolnica</th>
        <td mat-cell *matCellDef="let row">
          <span class="bolnica-badge">{{ row.bolnica?.naziv }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <div class="action-btns">
            <button class="action-btn edit" (click)="openDialog(2, row.id, row.naziv, row.lokacija, row.bolnica)">
              <mat-icon>edit</mat-icon>
            </button>
            <button class="action-btn delete" (click)="openDialog(3, row.id, row.naziv, row.lokacija, row.bolnica)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [pageSize]="5"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons>
    </mat-paginator>
  </div>

</div>
