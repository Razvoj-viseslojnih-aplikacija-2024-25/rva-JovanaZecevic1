<mat-toolbar>
  <span class="title-center">Odeljenje</span>
</mat-toolbar>
<div class="container mat-elevation-z8">
  <table mat-table matSort [dataSource]="dataSource" class="mat-cell">
    <ng-container matColumnDef="id">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>
    <ng-container matColumnDef="naziv">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Naziv</th>
      <td mat-cell *matCellDef="let row">{{ row.naziv }}</td>
    </ng-container>
    <ng-container matColumnDef="lokacija">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Lokacija</th>
      <td mat-cell *matCellDef="let row">{{ row.lokacija }}</td>
    </ng-container>
    <ng-container matColumnDef="bolnica">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Bolnica</th>
      <td mat-cell *matCellDef="let row">{{ row.bolnica?.naziv }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-icon-button (click)="openDialog(1)">
          <mat-icon color="accent">add</mat-icon>
        </button>
      </th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button (click)="openDialog(2, row.id, row.naziv, row.lokacija, row.bolnica)">
          <mat-icon color="primary">edit</mat-icon>
        </button>
        <button mat-icon-button (click)="openDialog(3, row.id, row.naziv, row.lokacija, row.bolnica)">
          <mat-icon color="warn">delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[2, 4, 5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
