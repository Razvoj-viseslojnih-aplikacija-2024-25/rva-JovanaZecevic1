<mat-toolbar>
  <span class="title-center">Pacijent</span>
</mat-toolbar>
<div class="container mat-elevation-z8">
  <table mat-table matSort [dataSource]="dataSource" class="mat-cell">
    <ng-container matColumnDef="id">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>
    <ng-container matColumnDef="ime">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Ime</th>
      <td mat-cell *matCellDef="let row">{{ row.ime }}</td>
    </ng-container>
    <ng-container matColumnDef="prezime">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Prezime</th>
      <td mat-cell *matCellDef="let row">{{ row.prezime }}</td>
    </ng-container>
    <ng-container matColumnDef="zdr_osiguranje">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Zdravstveno osiguranje</th>
      <td mat-cell *matCellDef="let row">{{ row.zdr_osiguranje ? 'Da' : 'Ne' }}</td>
    </ng-container>
    <ng-container matColumnDef="datum_rodjenja">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Datum rođenja</th>
      <td mat-cell *matCellDef="let row">{{ row.datum_rodjenja }}</td>
    </ng-container>
    <ng-container matColumnDef="odeljenje">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Odeljenje</th>
      <td mat-cell *matCellDef="let row">{{ row.odeljenje?.naziv }}</td>
    </ng-container>
    <ng-container matColumnDef="dijagnoza">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Dijagnoza</th>
      <td mat-cell *matCellDef="let row">{{ row.dijagnoza?.naziv }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-icon-button (click)="openDialog(1)">
          <mat-icon color="accent">add</mat-icon>
        </button>
      </th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button (click)="openDialog(2, row.id, row.ime, row.prezime, row.zdr_osiguranje, row.datum_rodjenja, row.odeljenje, row.dijagnoza)">
          <mat-icon color="primary">edit</mat-icon>
        </button>
        <button mat-icon-button (click)="openDialog(3, row.id, row.ime, row.prezime, row.zdr_osiguranje, row.datum_rodjenja, row.odeljenje, row.dijagnoza)">
          <mat-icon color="warn">delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[2, 4, 5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
