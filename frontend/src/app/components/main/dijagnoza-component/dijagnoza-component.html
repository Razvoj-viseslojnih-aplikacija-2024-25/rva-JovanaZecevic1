<div class="page-container">

  <div class="page-header">
    <div class="header-left">
      <div class="header-icon">
        <mat-icon>healing</mat-icon>
      </div>
      <div>
        <h1>Dijagnoze</h1>
        <p>Upravljanje medicinskim dijagnozama</p>
      </div>
    </div>
    <button class="add-btn" (click)="openDialog(1)">
      <mat-icon>add</mat-icon>
      Dodaj dijagnozu
    </button>
  </div>

  <div class="table-card">
    <table mat-table matSort [dataSource]="dataSource">

      <ng-container matColumnDef="id">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="naziv">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Naziv</th>
        <td mat-cell *matCellDef="let row">{{ row.naziv }}</td>
      </ng-container>

      <ng-container matColumnDef="opis">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Opis</th>
        <td mat-cell *matCellDef="let row">{{ row.opis }}</td>
      </ng-container>

      <ng-container matColumnDef="oznaka">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Oznaka</th>
        <td mat-cell *matCellDef="let row">
          <span class="oznaka-badge">{{ row.oznaka }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <div class="action-btns">
            <button class="action-btn edit" (click)="openDialog(2, row.id, row.naziv, row.opis, row.oznaka)">
              <mat-icon>edit</mat-icon>
            </button>
            <button class="action-btn delete" (click)="openDialog(3, row.id, row.naziv, row.opis, row.oznaka)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [pageSize]="5"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons>
    </mat-paginator>
  </div>

</div>
