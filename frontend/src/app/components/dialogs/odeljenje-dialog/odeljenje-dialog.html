<div class="dialog-container">

  <div class="dialog-header" [class.header-delete]="flag == 3">
    <div class="dialog-icon" [class.icon-delete]="flag == 3">
      <mat-icon>{{ flag == 3 ? 'delete' : flag == 2 ? 'edit' : 'add' }}</mat-icon>
    </div>
    <h3 *ngIf="flag == 1">Dodaj odeljenje</h3>
    <h3 *ngIf="flag == 2">Izmeni odeljenje</h3>
    <h3 *ngIf="flag == 3">Obriši odeljenje</h3>
    <p *ngIf="flag == 2 || flag == 3">{{ data.naziv }}</p>
  </div>

  <form class="dialog-form" #formControl="ngForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Naziv</mat-label>
      <input matInput name="naziv" [disabled]="flag == 3" [(ngModel)]="data.naziv" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Lokacija</mat-label>
      <input matInput name="lokacija" [disabled]="flag == 3" [(ngModel)]="data.lokacija" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Bolnica</mat-label>
      <mat-select [compareWith]="compare" name="bolnica" [disabled]="flag == 3" [(ngModel)]="data.bolnica" required>
        <mat-option *ngFor="let b of bolnice" [value]="b">{{ b.naziv }}</mat-option>
      </mat-select>
    </mat-form-field>
  </form>

  <div class="dialog-actions">
    <button class="btn-cancel" (click)="cancel()">Otkaži</button>
    <button class="btn-confirm" *ngIf="flag == 1" [disabled]="!formControl.valid" (click)="add()">Sačuvaj</button>
    <button class="btn-confirm" *ngIf="flag == 2" [disabled]="!formControl.valid" (click)="update()">Izmeni</button>
    <button class="btn-delete" *ngIf="flag == 3" (click)="delete()">Obriši</button>
  </div>

</div>
